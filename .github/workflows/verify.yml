name: Verify simulator and benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      - run: npm test
      - run: npm run audit:results
      - run: npm run audit:models
      - run: npm run audit:shifts
  fleet:
    name: ${{ matrix.audit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        audit: ['audit:fleet-decisions', 'audit:depot-repairs', 'audit:longmove:study', 'audit:longmove:ledgers', 'audit:moverecall:study', 'audit:moverecall:ledgers']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      - run: npm run "${{ matrix.audit }}"
  long-move-fit:
    name: Reproduce ${{ matrix.study }} fit ${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        study: [longmove, moverecall]
        seed: [13, 37, 73, 101, 211]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      - run: node training/${{ matrix.study }}/fit.mjs --check "${{ matrix.seed }}"
      - run: node training/${{ matrix.study }}/audit-fit.mjs "${{ matrix.seed }}"
